<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Eco cosmetics</title>
    <link
      rel="icon"
      href="src/images/logo.svg"
    />
    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />
  </head>
  <body>
    <header
      class="header"
      id="home"
    >
      <div class="container">
        <div class="header__nav">
          <a
            href="#"
            class="burger"
          >
            <span class="burger__label">Open menu</span>
          </a>
          <a
            href="#home"
            class="logo"
          >
            <img
              src="src/images/logo.svg"
              alt="eco cosmetics logo"
              class="logo__image"
            />
          </a>
          <nav
            class="nav"
            id="nav"
          >
            <ul class="nav__list">
              <li class="nav__item">
                <a
                  href="#shop"
                  class="nav__link"
                >
                  Shop
                </a>
              </li>
              <li class="nav__item">
                <a
                  href="#about"
                  class="nav__link"
                >
                  Contact
                </a>
              </li>
              <li class="nav__item">
                <a
                  href="#contact"
                  class="nav__link"
                >
                  About
                </a>
              </li>
            </ul>
          </nav>
          <a
            href="#shop"
            class="shop"
          >
            <img
              src="src/images/shop.svg"
              alt="shop"
              class="shop__image"
            />
          </a>
        </div>
      </div>
    </header>
    <div class="container">
      <section class="hero">
        <div class="hero__image-wrapper">
          <img
            src="src/images/hero-image.jpg"
            alt="Eco cosmetics image"
            class="hero__image"
          />
        </div>
        <div class="hero__content">
          <div class="hero__text">
            <h1 class="hero__title">
              Brand Of Eco-Cosmetics And Magic Candles
            </h1>
            <p class="hero__description">20% of sales at a wild bird shelter</p>
          </div>
          <a
            href="#shop"
            class="hero__button button"
          >
            Shop
          </a>
        </div>
      </section>
    </div>
    <script src="src/scripts/main.js"></script>
  </body>
</html>
